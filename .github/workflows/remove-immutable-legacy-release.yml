name: Retire immutable legacy release (one-time)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/remove-immutable-legacy-release.yml'

jobs:
  delete-legacy-release:
    if: github.repository == 'AkayamiShurui42/SetEditLocker'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete exposed-key 1.0 test release and associated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 1.0 >/dev/null 2>&1; then
            gh release delete 1.0 --yes --cleanup-tag
          fi
          if gh release view 1.0 >/dev/null 2>&1; then
            echo "::error::Legacy 1.0 release still exists."
            exit 1
          fi
