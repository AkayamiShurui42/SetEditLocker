name: Build signed Android release (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Check private signing secrets
        env:
          SETEDIT_RELEASE_KEYSTORE_B64: ${{ secrets.SETEDIT_RELEASE_KEYSTORE_B64 }}
          SETEDIT_RELEASE_STORE_PASSWORD: ${{ secrets.SETEDIT_RELEASE_STORE_PASSWORD }}
          SETEDIT_RELEASE_KEY_ALIAS: ${{ secrets.SETEDIT_RELEASE_KEY_ALIAS }}
          SETEDIT_RELEASE_KEY_PASSWORD: ${{ secrets.SETEDIT_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SETEDIT_RELEASE_KEYSTORE_B64 SETEDIT_RELEASE_STORE_PASSWORD \
            SETEDIT_RELEASE_KEY_ALIAS SETEDIT_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name. See SIGNING.md"
              exit 1
            fi
          done

      - name: Decode private keystore into runner temporary directory
        env:
          SETEDIT_RELEASE_KEYSTORE_B64: ${{ secrets.SETEDIT_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SETEDIT_RELEASE_KEYSTORE_B64" \
            | base64 --decode > "$RUNNER_TEMP/setedit-release.jks"
          test -s "$RUNNER_TEMP/setedit-release.jks"

      - name: Run tests and create signed release APK
        env:
          SETEDIT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/setedit-release.jks
          SETEDIT_RELEASE_STORE_PASSWORD: ${{ secrets.SETEDIT_RELEASE_STORE_PASSWORD }}
          SETEDIT_RELEASE_KEY_ALIAS: ${{ secrets.SETEDIT_RELEASE_KEY_ALIAS }}
          SETEDIT_RELEASE_KEY_PASSWORD: ${{ secrets.SETEDIT_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Verify release signature before publishing artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f \
            -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Upload verified signed release APK for manual review
        uses: actions/upload-artifact@v4
        with:
          name: seteditlocker-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 5

      - name: Delete temporary private signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/setedit-release.jks"
